[tool.poetry]
name = "microframe"
version = "2.0.0"
description = "Moteur de rendu Jinja2 avec composants, cache et micro-frontends"
authors = ["Traore Eliezer <traoreera@gmail.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.13"
jinja2 = "^3.1.6"
markupsafe = "^3.0.3"
httpx = "^0.27.0"
django = "^6.0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
black = "^24.3.0"
flake8 = "^7.0.0"
mypy = "^1.9.0"
isort = "^7.0.0"
pytest-cov = "^7.0.0"



[tool.poetry.scripts]
microframe = "microframe.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
